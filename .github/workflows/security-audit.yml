name: security-audit

# RUSTSEC 권고는 코드 변경 없이도 새로 발행된다. windows-ci는 push/PR 때만
# audit을 돌리므로, 권고 발행과 main 푸시 사이에 생긴 취약성이 뒤늦게
# 발견되어 CI를 깨뜨린다. 이 워크플로는 매일 audit만 가볍게 돌려
# drift를 조기에 알린다 (Dependabot PR이 뒤따라 수정).
on:
  schedule:
    # 매일 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
