name: windows-ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Machete
        run: |
          cargo install cargo-machete --locked
          cargo machete

      - name: Test
        run: cargo test --workspace

      - name: Build and Strict Packaged Self Check
        shell: pwsh
        working-directory: .
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_release.ps1 -NoSign

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: KakaoTalkLayoutAdBlocker_v11
          path: |
            dist/KakaoTalkLayoutAdBlocker_v11.exe
            dist/kakao-updater.exe
            dist/KakaoTalkLayoutAdBlocker_v11.zip
