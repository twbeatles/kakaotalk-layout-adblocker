name: windows-ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Machete
        run: |
          cargo install cargo-machete --locked
          cargo machete

      - name: Test
        run: cargo test --workspace

      - name: Release Build
        run: cargo build --release -p kakao-app -p kakao-updater

      - name: Copy Release Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          Copy-Item -Force .\target\release\kakao-adblock-rs.exe ..\dist\KakaoTalkLayoutAdBlocker_v11.exe
          Copy-Item -Force .\target\release\kakao-updater.exe ..\dist\kakao-updater.exe

      - name: Packaged Self Check
        shell: pwsh
        run: ..\dist\KakaoTalkLayoutAdBlocker_v11.exe --self-check --json

      - name: Pack Release Zip
        shell: pwsh
        run: |
          Compress-Archive -Force -Path ..\dist\KakaoTalkLayoutAdBlocker_v11.exe,..\dist\kakao-updater.exe -DestinationPath ..\dist\KakaoTalkLayoutAdBlocker_v11.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KakaoTalkLayoutAdBlocker_v11
          path: |
            dist/KakaoTalkLayoutAdBlocker_v11.exe
            dist/kakao-updater.exe
            dist/KakaoTalkLayoutAdBlocker_v11.zip
