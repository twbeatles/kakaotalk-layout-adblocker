[workspace]
members = [
    "crates/kakao-core",
    "crates/kakao-win32",
    "crates/kakao-app",
    "crates/kakao-updater",
]
resolver = "2"

[workspace.package]
version = "11.1.13"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ed25519-dalek = "3"
hex = "0.4"
kakao-core = { path = "crates/kakao-core" }
kakao-win32 = { path = "crates/kakao-win32" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
windows = "0.62"

# Size/speed for the shipped EXE. `panic` stays "unwind" on purpose: the engine
# worker contains tick panics with catch_unwind so hidden windows can still be
# restored (PROJECT_AUDIT 2026-09-24 P9/§5).
[profile.release]
lto = true
codegen-units = 1
strip = true
