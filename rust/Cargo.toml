[workspace]
members = [
    "crates/kakao-core",
    "crates/kakao-win32",
    "crates/kakao-app",
    "crates/kakao-updater",
]
resolver = "2"

[workspace.package]
version = "11.1.3"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ed25519-dalek = "2"
hex = "0.4"
kakao-core = { path = "crates/kakao-core" }
kakao-win32 = { path = "crates/kakao-win32" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", features = ["json", "tls"] }
windows = "0.61"
