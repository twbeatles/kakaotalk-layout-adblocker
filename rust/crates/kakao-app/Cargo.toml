[package]
name = "kakao-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "KakaoTalk layout adblock native application"
default-run = "kakao-adblock-rs"

[lib]
name = "kakao_app"
path = "src/lib.rs"

[[bin]]
name = "kakao-adblock-rs"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crossbeam-channel.workspace = true
kakao-core.workspace = true
kakao-win32.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
sha2.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber.workspace = true
